name: Publish website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: Build (fails on broken links)
        run: scripts/build-site.sh
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Pull requests only check that the site builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
